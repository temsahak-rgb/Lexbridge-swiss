
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <meta name="theme-color" content="#14243a">

  <meta name="description"
        content="LexBridge Swiss Corporate — Modular Legal Workflow Automation">

  <title>LexBridge | Swiss Corporate</title>

  <!-- Main stylesheet -->
  <link rel="stylesheet" href="./css/base.css">

  <style>
    /* Basic fallback styling */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #14243a;
    }

    [hidden] {
      display: none !important;
    }

    #error-monitor {
      position: fixed;
      bottom: 16px;
      left: 16px;
      right: 16px;
      max-height: 45vh;
      overflow-y: auto;
      background: #fff1f0;
      color: #8b1e1e;
      border: 2px solid #d94b4b;
      border-radius: 10px;
      padding: 16px;
      z-index: 99999;
      box-shadow: 0 6px 24px rgba(0,0,0,.18);
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    #error-monitor h3 {
      margin: 0 0 8px;
      font-size: 16px;
    }

    #error-list {
      margin: 8px 0;
      padding-left: 20px;
    }

    #error-list li {
      margin-bottom: 8px;
      white-space: pre-wrap;
    }

    #close-errors {
      padding: 7px 12px;
      border: 1px solid #d94b4b;
      background: white;
      color: #8b1e1e;
      border-radius: 6px;
      cursor: pointer;
    }

    .app-shell {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
    }

    .site-header {
      background: #14243a;
      color: white;
      padding: 20px 24px;
    }

    .site-header h1 {
      margin: 0;
      font-size: 24px;
    }

    .site-header p {
      margin: 4px 0 0;
      color: #bfcbd9;
      font-size: 12px;
    }

    .welcome-panel {
      background: white;
      border: 1px solid #e1e5eb;
      border-radius: 12px;
      padding: 30px;
    }

    .welcome-panel h2 {
      margin-top: 0;
    }

    .status-text {
      color: #687587;
      font-size: 13px;
    }
  </style>

  <!-- Error monitoring: load BEFORE application code -->
  <script>
    (function () {
      "use strict";

      const errors = [];
      const maximumErrors = 30;

      function showError(message) {
        const text = String(message || "Unknown error");

        if (errors.length >= maximumErrors) {
          return;
        }

        errors.push(text);

        const panel = document.getElementById("error-monitor");
        const list = document.getElementById("error-list");

        if (!panel || !list) {
          return;
        }

        const item = document.createElement("li");
        item.textContent = text;

        list.appendChild(item);
        panel.hidden = false;
      }

      // Expose a controlled reporting function to application modules.
      window.LexBridgeReportError = showError;

      // Capture JavaScript runtime errors and resource-load errors.
      window.addEventListener("error", function (event) {
        if (event.target &&
            event.target !== window) {
          const source = event.target.src ||
                         event.target.href ||
                         event.target.tagName;

          showError("Resource failed to load: " + source);
          return;
        }

        const location = [
          event.filename || "unknown file",
          event.lineno || "?",
          event.colno || "?"
        ].join(":");

        showError(
          "JavaScript error: " +
          (event.message || "Unknown error") +
          "\nLocation: " + location
        );
      }, true);

      // Capture unhandled Promise rejections.
      window.addEventListener("unhandledrejection", function (event) {
        const reason = event.reason;

        const message = reason instanceof Error
          ? reason.message
          : String(reason || "Unknown Promise error");

        showError("Unhandled Promise rejection: " + message);
      });

      // Show queued errors once HTML has been parsed.
      document.addEventListener("DOMContentLoaded", function () {
        const panel = document.getElementById("error-monitor");
        const list = document.getElementById("error-list");
        const close = document.getElementById("close-errors");

        errors.forEach(function (message) {
          const item = document.createElement("li");
          item.textContent = message;
          list.appendChild(item);
        });

        if (errors.length > 0) {
          panel.hidden = false;
        }

        close.addEventListener("click", function () {
          panel.hidden = true;
        });
      });
    })();
  </script>
</head>

<body>

  <!-- Header -->
  <header class="site-header">
    <h1>LexBridge</h1>
    <p>SWISS CORPORATE · LEGAL WORKFLOW AUTOMATION</p>
  </header>

  <!-- Application -->
  <main class="app-shell">

    <section class="welcome-panel">
      <h2>Swiss Corporate Governance</h2>

      <p>
        A modular legal workflow platform for Swiss
        corporate administration and registry procedures.
      </p>

      <p class="status-text" id="app-status">
        Initializing application...
      </p>
    </section>

    <!-- Dynamic modules will appear here -->
    <section id="module-container"
             aria-label="Application modules">
    </section>

  </main>

  <!-- Error monitor -->
  <aside id="error-monitor"
         role="alert"
         aria-live="assertive"
         aria-label="Application errors"
         hidden>

    <h3>LexBridge — Error Monitor</h3>

    <p>
      An error occurred while loading or running the application.
    </p>

    <ol id="error-list"></ol>

    <button id="close-errors" type="button">
      Close
    </button>
  </aside>

  <!-- Main JavaScript application -->
  <script type="module" src="./js/app.js"></script>

</body>
</html>
